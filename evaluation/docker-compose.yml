      DEVICE_COUNT: "3"
      NODE_INDEX: "1"
      IP: "client2"
      PORT: "8081"
      RABBITMQ_URL: "amqp://rabbitmq:rabbitmq@broker:5672/client2"
      NEIGHBORS: "edge1,8083"
      NODE_TYPE: "client"
